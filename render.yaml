# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ajaia-docs
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: SESSION_SECRET
        generateValue: true
      # Optional but recommended: a free Turso (libSQL) DB so data survives
      # restarts. Without these the app falls back to an ephemeral SQLite file.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
